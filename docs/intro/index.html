<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>제뉴원사이언스 회사소개</title><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>html,body{height:100%;margin:0;font-family:Pretendard,system-ui,sans-serif;background:#f3f8f8;color:#221714}
.box{max-width:360px;margin:18vh auto;padding:30px 26px;background:#fff;border-radius:16px;box-shadow:0 14px 44px rgba(0,80,90,.14)}
.bar{height:4px;border-radius:2px;background:linear-gradient(90deg,#8FC31F,#00A099,#036DB8);margin:-30px -26px 22px;border-radius:16px 16px 0 0}
h1{font-size:19px;margin:0 0 6px}p{font-size:13px;color:#5b6b6b;margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #cfdede;font-size:16px;font-family:inherit}
input:focus{outline:2px solid #00A099;border-color:transparent}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#00A099;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:wait}
.err{color:#d64545;font-size:12.5px;margin-top:10px;min-height:16px}
.prog{height:4px;background:#e6efef;border-radius:2px;margin-top:14px;overflow:hidden;display:none}.prog i{display:block;height:100%;width:0;background:#00A099;transition:width .2s}
.foot{font-size:10.5px;color:#8a9a9a;margin-top:18px;line-height:1.5}</style></head>
<body><div class="box"><div class="bar"></div><h1>제뉴원사이언스 회사소개</h1><p>비밀번호를 입력하세요</p>
<input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" ><button id="go">열기</button>
<div class="prog" id="prog"><i></i></div><div class="err" id="err"></div>
<div class="foot">본 자료의 권리는 제뉴원사이언스에 귀속됩니다.</div></div>
<script>
(function(){
const P={"salt": "9WMK21SeuSi4lC0wigAlVA==", "iter": 200000, "assets": [["logo_color.png", "00.bin", "image/png", 118898], ["motion.mp4", "01.bin", "video/mp4", 26257143], ["p52.png", "02.bin", "image/png", 197019], ["p53.png", "03.bin", "image/png", 107772], ["p54.png", "04.bin", "image/png", 67584], ["p55.png", "05.bin", "image/png", 71023], ["p56.png", "06.bin", "image/png", 694053], ["p57.png", "07.bin", "image/png", 173039], ["p58.png", "08.bin", "image/png", 96446], ["p59.png", "09.bin", "image/png", 118462], ["p60.png", "10.bin", "image/png", 48664], ["p61.png", "11.bin", "image/png", 223034], ["p62.png", "12.bin", "image/png", 49359], ["p63.png", "13.bin", "image/png", 205670], ["p64.png", "14.bin", "image/png", 141274], ["p65.png", "15.bin", "image/png", 115075], ["p66.png", "16.bin", "image/png", 7844], ["p67.png", "17.bin", "image/png", 3408], ["p69.png", "18.bin", "image/png", 75367], ["p70.png", "19.bin", "image/png", 61124], ["p71.png", "20.bin", "image/png", 21095], ["p72.png", "21.bin", "image/png", 26636], ["p73.png", "22.bin", "image/png", 777160], ["p74.png", "23.bin", "image/png", 183043], ["p76.png", "24.bin", "image/png", 687811], ["p77.png", "25.bin", "image/png", 371605], ["p78.png", "26.bin", "image/png", 215530], ["p79.png", "27.bin", "image/png", 371856], ["p80.png", "28.bin", "image/png", 296118], ["p81.png", "29.bin", "image/png", 284666], ["p82.png", "30.bin", "image/png", 210492], ["p83.png", "31.bin", "image/png", 338465], ["p96.png", "32.bin", "image/png", 31365], ["p97.png", "33.bin", "image/png", 30916], ["s1_cover.jpg", "34.bin", "image/jpeg", 715735], ["s2_line.jpg", "35.bin", "image/jpeg", 1354], ["s2_mark.png", "36.bin", "image/png", 19114], ["s2_micro.jpg", "37.bin", "image/jpeg", 584260], ["s3_bulb.jpg", "38.bin", "image/jpeg", 232042], ["s3_icon1.png", "39.bin", "image/png", 11592], ["s3_icon2.png", "40.bin", "image/png", 15149], ["s3_icon3.png", "41.bin", "image/png", 11069], ["s3_icon4.png", "42.bin", "image/png", 9597], ["s3_icon5.png", "43.bin", "image/png", 9338], ["s3_icon6.png", "44.bin", "image/png", 14083], ["s3_line.png", "45.bin", "image/png", 628], ["s4_hand.png", "46.bin", "image/png", 3938744], ["s4_top.jpg", "47.bin", "image/jpeg", 38958], ["s4_wave_l.png", "48.bin", "image/png", 1787725], ["s4_wave_r.png", "49.bin", "image/png", 1707282], ["s5_icon1.png", "50.bin", "image/png", 7692], ["s5_icon2.png", "51.bin", "image/png", 3152], ["s5_icon3.png", "52.bin", "image/png", 4211], ["s5_icon4.png", "53.bin", "image/png", 4387], ["s5_panel.jpg", "54.bin", "image/jpeg", 39985], ["s5_wave.png", "55.bin", "image/png", 1710611], ["s6_plate.jpg", "56.bin", "image/jpeg", 219023], ["s7_plate.jpg", "57.bin", "image/jpeg", 370879], ["s8_jecheon.jpg", "58.bin", "image/jpeg", 25247], ["s8_lab.jpg", "59.bin", "image/jpeg", 29635], ["s8_sejong.jpg", "60.bin", "image/jpeg", 26135], ["s8_seoul.jpg", "61.bin", "image/jpeg", 90381], ["s8_top.jpg", "62.bin", "image/jpeg", 186417], ["s9_left.jpg", "63.bin", "image/jpeg", 215355], ["s9_wave.png", "64.bin", "image/png", 2295740]]};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},
  await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['decrypt']); }
async function open(key,file){ const b=new Uint8Array(await (await fetch('d/'+file)).arrayBuffer()); return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)); }
const $=id=>document.getElementById(id);
async function go(){
  const pw=$('pw').value; if(!pw) return;
  $('go').disabled=true; $('err').textContent='';
  try{
    const key=await derive(pw);
    let html=new TextDecoder().decode(await open(key,'page.bin'));       // 비밀번호가 틀리면 여기서 실패
    $('prog').style.display='block';
    const total=P.assets.reduce((a,x)=>a+x[3],0); let done=0; const A={};
    await Promise.all(P.assets.map(async([n,f,mime,size])=>{
      A[n]=URL.createObjectURL(new Blob([await open(key,f)],{type:mime}));
      done+=size; $('prog').firstChild.style.width=(done/total*100)+'%';
    }));
    for(const n in A) html=html.split('assets/'+n).join(A[n]);
    html=html.replace('<head>','<head><script>window.__ASSET='+JSON.stringify(A)+'<\/script>');
    try{ sessionStorage.setItem('gs_pw',pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){ $('go').disabled=false; $('prog').style.display='none'; $('err').textContent='비밀번호가 올바르지 않습니다.'; }
}
$('go').onclick=go; $('pw').onkeydown=e=>{ if(e.key==='Enter') go(); };
try{ const s=sessionStorage.getItem('gs_pw'); if(s){ $('pw').value=s; go(); } }catch(e){}
$('pw').focus();
})();
</script></body></html>
