<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>제뉴원사이언스 회사소개</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>html,body{height:100%;margin:0;background:#fff;font-family:Pretendard,system-ui,sans-serif;color:#221714}
.wrap{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
.ring{position:relative;width:168px;height:168px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .spin{position:absolute;inset:0;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:#00A099;font-variant-numeric:tabular-nums}
p{margin:22px 0 0;font-size:16px;color:#4a5555;letter-spacing:.5px}
small{display:block;margin-top:6px;font-size:12px;color:#9aa8a8}</style></head>
<body><div class="wrap"><div>
<div class="ring">
  <svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8FC31F"/><stop offset=".5" stop-color="#00A099"/><stop offset="1" stop-color="#036DB8"/></linearGradient></defs>
    <circle cx="50" cy="50" r="44" fill="none" stroke="#e8f0f0" stroke-width="6"/>
    <circle id="bar" cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" style="transition:stroke-dashoffset .3s"/></svg>
  <svg class="spin" viewBox="0 0 100 100"><circle cx="50" cy="3" r="3" fill="#00A099"/></svg>
  <b id="pct">0%</b>
</div>
<p>로딩 중입니다</p><small>고화질 이미지와 영상을 불러오고 있습니다</small>
</div></div>
<script>
(async function(){
const LIST=[["logo_color.png", 118898], ["motion.mp4", 26257143], ["p52.png", 197019], ["p53.png", 107772], ["p54.png", 67584], ["p55.png", 71023], ["p56.png", 694053], ["p57.png", 173039], ["p58.png", 96446], ["p59.png", 118462], ["p60.png", 48664], ["p61.png", 223034], ["p62.png", 49359], ["p63.png", 205670], ["p64.png", 141274], ["p65.png", 115075], ["p66.png", 7844], ["p67.png", 3408], ["p69.png", 75367], ["p70.png", 61124], ["p71.png", 21095], ["p72.png", 26636], ["p73.png", 777160], ["p74.png", 183043], ["p76.png", 687811], ["p77.png", 371605], ["p78.png", 215530], ["p79.png", 371856], ["p80.png", 296118], ["p81.png", 284666], ["p82.png", 210492], ["p83.png", 338465], ["p96.png", 31365], ["p97.png", 30916], ["s1_cover.jpg", 715735], ["s2_line.jpg", 1354], ["s2_mark.png", 19114], ["s2_micro.jpg", 584260], ["s3_bulb.jpg", 232042], ["s3_icon1.png", 11592], ["s3_icon2.png", 15149], ["s3_icon3.png", 11069], ["s3_icon4.png", 9597], ["s3_icon5.png", 9338], ["s3_icon6.png", 14083], ["s3_line.png", 628], ["s4_hand.png", 3938744], ["s4_top.jpg", 38958], ["s4_wave_l.png", 1787725], ["s4_wave_r.png", 1707282], ["s5_icon1.png", 7692], ["s5_icon2.png", 3152], ["s5_icon3.png", 4211], ["s5_icon4.png", 4387], ["s5_panel.jpg", 39985], ["s5_wave.png", 1710611], ["s6_plate.jpg", 219023], ["s7_plate.jpg", 370879], ["s8_jecheon.jpg", 25247], ["s8_lab.jpg", 29635], ["s8_sejong.jpg", 26135], ["s8_seoul.jpg", 90381], ["s8_top.jpg", 186417], ["s9_left.jpg", 215355], ["s9_wave.png", 2295740]], total=LIST.reduce((a,x)=>a+x[1],0); let got=0;
const bar=document.getElementById('bar'), pct=document.getElementById('pct');
const show=()=>{ const p=Math.min(1,got/total); bar.style.strokeDashoffset=276.5*(1-p); pct.textContent=Math.floor(p*100)+'%'; };
async function load(name){            // 바이트 단위로 진행률 반영
  const r=await fetch('assets/'+name), rd=r.body.getReader(), parts=[];
  for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got+=value.length; show(); }
  return URL.createObjectURL(new Blob(parts,{type:r.headers.get('content-type')||''}));
}
try{
  const [html, urls]=await Promise.all([fetch('page.html').then(r=>r.text()), Promise.all(LIST.map(([n])=>load(n)))]);
  const A={}; LIST.forEach(([n],i)=>A[n]=urls[i]);
  let h=html; for(const n in A) h=h.split('assets/'+n).join(A[n]);
  h=h.replace('<head>','<head><script>window.__ASSET='+JSON.stringify(A)+'<\/script>');
  got=total; show(); await new Promise(r=>setTimeout(r,300));
  document.open(); document.write(h); document.close();
}catch(e){ location.replace('page.html'); }   // 실패 시 일반 페이지로
})();
</script></body></html>
