<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Genuone Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#17202b;--muted:#6b7a8c;--line:#e3e8ef;--brand:#1f3864;--brand2:#2e75b6;--soft:#eaf3fb;--up:#c00000;--down:#1f6fb2;--warn:#b7791f;--shadow:0 1px 3px rgba(16,24,40,.06)}
:root[data-theme=dark]{--bg:#0f1622;--panel:#17202d;--ink:#e8edf4;--muted:#8d9bb0;--line:#2a3545;--brand:#8db4e8;--brand2:#5aa0e6;--soft:#1d2a3d;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}
a{color:var(--brand2);text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.top .b{font-weight:700;font-size:15px;white-space:nowrap}.top .t{flex:1;font-size:13px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 48px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px}
.side .g{font-size:11px;color:var(--muted);margin:12px 8px 4px;letter-spacing:.3px}
.side .it{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.side .it.on{background:var(--soft);color:var(--brand);font-weight:700}
main{padding:14px 16px 90px;max-width:1200px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:14px;color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--muted)}.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.3px}.kpi .d{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 6px;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hint{font-size:12px;color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--brand);font-weight:600}
.badge.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:14px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--panel)}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tabbar{display:none}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{display:none}.side.open{display:block;position:fixed;top:48px;left:0;right:0;bottom:0;z-index:30;overflow:auto}
 .kpis{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}main{padding:12px 12px 80px}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
 .tabbar div{flex:1;text-align:center;padding:9px 2px;font-size:11px;color:var(--muted)}.tabbar div.on{color:var(--brand);font-weight:700}}
svg text{font-family:inherit}
</style>
</head>
<body>
<div class="top"><span class="b">GNS Monitor</span><span class="t" id="ptitle">이슈 대시보드</span><button id="menuBtn">메뉴</button><button id="themeBtn">테마</button></div>
<div class="wrap"><nav class="side" id="side"></nav><main id="main"></main></div>
<div class="tabbar" id="tabbar"></div>
<script>/*__DATA__*/</script>
<script>
(()=>{
const D=window.__DATA||{};
const MENU=[
 {g:'홈',items:[['home','이슈 대시보드']]},
 {g:'시장 분석 (특화 모델)',items:[['market','시장 요약 (IQVIA)'],['molecule','성분 시장 분석'],['form','제형 시장 분석'],['company','대상회사 분석']]},
 {g:'수주·자사',items:[['cmo','수주 기회 (CMO 지도)'],['products','자사 품목·성분'],['backlog','설비 부하·수주잔고']]},
 {g:'데이터',items:[['inventory','데이터 현황·기준시점']]}];
const TABS=[['home','홈'],['molecule','성분'],['company','회사'],['cmo','수주'],['inventory','데이터']];
const fmt=n=>n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ko-KR');
const eok=n=>n==null?'—':(Math.abs(n)>=1e12?(n/1e12).toFixed(1)+'조':fmt(n/1e8)+'억');
const pct=(n,d=1)=>n==null||isNaN(n)?'—':(n>0?'+':'')+Number(n).toFixed(d)+'%';
const cls=n=>n>0?'up':n<0?'down':'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function spark(vals,w=320,h=70,labels){ if(!vals||!vals.length) return ''; const mx=Math.max(...vals),mn=Math.min(...vals,0);const sx=(w-8)/(vals.length-1||1),sy=(h-18)/((mx-mn)||1);
 const pts=vals.map((v,i)=>[4+i*sx,h-14-(v-mn)*sy]); const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const lab=labels?`<text x="4" y="${h-2}" font-size="9" fill="var(--muted)">${esc(labels[0])}</text><text x="${w-4}" y="${h-2}" font-size="9" fill="var(--muted)" text-anchor="end">${esc(labels[labels.length-1])}</text>`:'';
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--brand2)" stroke-width="2"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--brand2)"/>${lab}</svg>`;}
function bars(items,nameK='name',valK='share',max){ if(!items||!items.length) return '<div class="hint">자료 없음</div>'; const m=max||Math.max(...items.map(x=>x[valK]||0))||1;
 return items.map(x=>`<div style="display:grid;grid-template-columns:minmax(90px,38%) 1fr 54px;gap:8px;align-items:center;margin:4px 0;font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x[nameK])}</span><div class="bar"><i style="width:${Math.min(100,(x[valK]||0)/m*100)}%"></i></div><span class="n" style="text-align:right">${Number(x[valK]||0).toFixed(1)}%</span></div>`).join('');}
function tbl(cols,rows){ return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function kpi(k,v,d){return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`;}
const M=document.getElementById('main');let cur='home',LIVE=null;
function nav(){document.getElementById('side').innerHTML=MENU.map(g=>`<div class="g">${g.g}</div>`+g.items.map(([v,l])=>`<span class="it ${v===cur?'on':''}" data-v="${v}">${l}</span>`).join('')).join('');
 document.getElementById('tabbar').innerHTML=TABS.map(([v,l])=>`<div class="${v===cur?'on':''}" data-v="${v}">${l}</div>`).join('');
 document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>go(e.dataset.v));}
function go(v,arg){cur=v;document.getElementById('side').classList.remove('open');nav();window.scrollTo(0,0);
 document.getElementById('ptitle').textContent=(MENU.flatMap(g=>g.items).find(x=>x[0]===v)||[,''])[1];({home,market,molecule,form,company,cmo,products,backlog,inventory})[v](arg);}
document.getElementById('menuBtn').onclick=()=>document.getElementById('side').classList.toggle('open');
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;const d=r.getAttribute('data-theme')==='dark';r.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('gns_theme',d?'light':'dark');};
if(localStorage.getItem('gns_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');

/* ── 홈 ── */
function home(){const I=D.issues||{};const idx=(LIVE&&LIVE.market&&Object.keys(LIVE.market.indices||{}).length)?Object.entries(LIVE.market.indices).map(([n,v])=>({name:n,latest:v})):(I.indices||[]);
 let h=`<div class="hint" style="margin-bottom:8px">데이터 기준 ${esc(D.built_at)}${LIVE?` · 실시간 공시·뉴스 ${esc(LIVE.fetched_at)}`:''}</div><div class="kpis">`+idx.slice(0,4).map(x=>kpi(esc(x.name),fmt(x.latest?.close),`<span class="${cls(x.latest?.change_rate)}">${pct(x.latest?.change_rate,2)}</span> ${esc(x.latest?.date||'')}`)).join('')+`</div>`;
 h+=`<div class="card"><h3>오늘의 핵심</h3>${(I.headline||[]).map(s=>`<div style="padding:5px 0;border-bottom:1px solid var(--line)">• ${esc(s)}</div>`).join('')||'<div class="hint">없음</div>'}</div>`;
 h+=`<div class="row2"><div class="card"><h3>주요 이슈</h3>${(I.issues||[]).map(x=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="badge ${x.severity==='high'?'w':''}">${esc(x.kind)}</span> <a href="${esc(x.ref||'#')}" target="_blank">${esc(x.title)}</a><div class="hint">${esc(x.detail||'')} · ${esc(x.source||'')}</div></div>`).join('')}</div>`;
 const peers=(I.peers||[]);h+=`<div class="card"><h3>경쟁사 주가</h3>${tbl([{h:'회사',f:r=>esc(r.name)},{h:'종가',n:1,f:r=>fmt(r.latest?.close)},{h:'등락',n:1,f:r=>`<span class="${cls(r.latest?.change_rate)}">${pct(r.latest?.change_rate,2)}</span>`},{h:'시총',n:1,f:r=>eok(r.latest?.market_cap)}],peers)}</div></div>`;
 const live=LIVE?LIVE.dart||[]:(I.self_disclosures||[]);h+=`<div class="row2"><div class="card"><h3>공시 (DART)</h3>${live.slice(0,15).map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><a href="${esc(x.url||x.link||'#')}" target="_blank">${esc(x.title||x.report_nm)}</a><div class="hint">${esc(x.company||x.corp_name||'')} · ${esc(x.date||x.rcept_dt||'')}</div></div>`).join('')||'<div class="hint">최근 공시 없음</div>'}</div>`;
 const news=LIVE?LIVE.news||[]:(D.news?.articles||[]);h+=`<div class="card"><h3>업계 뉴스</h3>${news.slice(0,20).map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><a href="${esc(x.url||x.link||'#')}" target="_blank">${esc(x.title)}</a><div class="hint">${esc(x.source||'')} · ${esc(x.date||x.pub_date||'')}</div></div>`).join('')}</div></div>`;
 h+=`<div class="card"><h3>규제·처분</h3>${(I.regulatory||[]).slice(0,10).map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><a href="${esc(x.link||'#')}" target="_blank">${esc(x.title)}</a><div class="hint">${esc(x.source||'')} · ${esc(x.pub_date||'')}</div></div>`).join('')}${(I.admin_actions||[]).slice(0,8).map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(x.company)}</b> ${esc(x.action)}<div class="hint">${esc(x.date||'')} ${esc(x.product||'')}</div></div>`).join('')}</div>`;
 M.innerHTML=h;}

/* ── 시장 요약 ── */
function market(){const m=D.market||{},mm=D.market_meta||{};const qs=m.quarters||[];const last=qs[qs.length-1]||{},prev=qs[qs.length-5]||{};
 let h=`<div class="kpis">${kpi('국내 의약품 시장 ('+esc(m.latest_q||'')+')',eok(last.amount),'분기 매출 (IQVIA)')}${kpi('전년 동분기 대비',pct(prev.amount?(last.amount/prev.amount-1)*100:null),'')}${kpi('제뉴원 분기 매출',eok(m.our_amount),'점유 '+pct(m.our_share,2).replace('+',''))}${kpi('성분 수',fmt(mm.molecule_count),'파일 '+esc(mm.file||''))}</div>`;
 h+=`<div class="card"><h3>분기 추이 (전체 시장, 억원)</h3>${spark(qs.map(q=>q.amount/1e8),420,90,qs.map(q=>q.q))}</div>`;
 h+=`<div class="row2"><div class="card"><h3>상위 제조사 점유 (${esc(m.latest_q||'')})</h3>${bars(m.makers||[])}</div>`;
 const self=D.companies_detail?.[D.company]?.profile?.market;h+=`<div class="card"><h3>제뉴원 주요 품목 (IQVIA)</h3>${tbl([{h:'품목',f:r=>esc(r.name)},{h:'영역',f:r=>esc(r.area)},{h:'매출',n:1,f:r=>eok(r.amount)},{h:'비중',n:1,f:r=>r.share+'%'}],self?.products||[])}</div></div>`;
 M.innerHTML=h;}

/* ── 성분 시장 ── */
function block(b,extra){const qs=D.market_meta?.quarters||[];
 let h=`<div class="kpis">${kpi('시장 규모 ('+esc(D.market_meta?.latest_q||'')+')',eok(b.latest),'분기')}${kpi('전년 동분기 대비',`<span class="${cls(b.yoy)}">${pct(b.yoy)}</span>`,'')}${kpi('제조사 수',fmt(b.maker_count),'상위 1위 '+esc(b.makers?.[0]?.name||'')+' '+(b.makers?.[0]?.share||0)+'%')}${kpi('제뉴원 점유',pct(b.our_share,2).replace('+',''),eok(b.our_amount))}</div>`;
 h+=`<div class="card"><h3>분기 추이 (억원)</h3>${spark(b.trend.map(v=>v/1e8),420,90,qs)}</div>`;
 h+=`<div class="row2"><div class="card"><h3>제조사 점유</h3>${bars(b.makers)}</div><div class="card"><h3>상위 제품</h3>${tbl([{h:'제품',f:r=>esc(r.name)},{h:'매출',n:1,f:r=>eok(r.amount)},{h:'점유',n:1,f:r=>r.share+'%'}],b.products||[])}</div></div>`;
 if(b.our_products?.length)h+=`<div class="card"><h3>제뉴원 품목</h3>${tbl([{h:'제품',f:r=>esc(r.name)},{h:'분기 매출',n:1,f:r=>eok(r.amount)}],b.our_products)}</div>`;
 return h+(extra||'');}
function molecule(q){const names=Object.keys(D.molecules||{}).sort((a,b)=>D.molecules[b].latest-D.molecules[a].latest);
 let h=`<div class="card"><input id="mq" list="mlist" placeholder="성분 검색 (영문, 예: MIRABEGRON / ATORVASTATIN)" value="${esc(q||'')}"><datalist id="mlist">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="chips">${names.slice(0,12).map(n=>`<span class="chip ${n===q?'on':''}" data-m="${esc(n)}">${esc(n.split(',')[0].slice(0,18))}</span>`).join('')}</div><div class="hint">상위 400 성분 + 제뉴원 생산 성분 · 시장 = IQVIA 분기 매출 · 제조사 = 판매사 기준</div></div>`;
 const b=q&&D.molecules[q];
 if(b){const ing=(D.ingredients?.items||[]).find(x=>String(x.en||'').toLowerCase().split(',')[0].trim()===q.toLowerCase().split(',')[0].trim());
  let ex='';if(ing){ex=`<div class="card"><h3>제뉴원 내부 실적 — ${esc(ing.name)} (${esc(D.ingredients.year)})</h3><div class="kpis">${kpi('자사 매출',eok(ing.sales),'제뉴원+제뉴파마')}${kpi('수탁 비중',(ing.cmo_share??'—')+'%','')}${kpi('공헌이익률',(ing.margin_pct??'—')+'%','')}${kpi('품목 수',fmt(ing.items),'')}</div>${tbl([{h:'품목',f:r=>esc(r.product)},{h:'허가사',f:r=>esc(r.holder)},{h:'구분',f:r=>esc(r.unit)},{h:'제형',f:r=>esc(r.form)},{h:'매출',n:1,f:r=>eok(r.sales)},{h:'공헌',n:1,f:r=>(r.margin??'—')+'%'}],ing.products||[])}${(ing.insights||[]).map(i=>`<div class="hint">• ${esc(i[1])}</div>`).join('')}</div>`;}
  h+=`<div class="card"><h3>${esc(q)} <span class="hint">${esc(b.atc2||'')} · ${esc(b.nfc1||'')}</span></h3></div>`+block(b,ex);}
 else h+=`<div class="card hint">성분을 선택하면 시장 규모·추이·제조사 점유·제뉴원 위치가 표시됩니다.</div>`;
 M.innerHTML=h;document.getElementById('mq').onchange=e=>molecule(e.target.value);document.querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>molecule(c.dataset.m));}

/* ── 제형 시장 ── */
function form(q){const keys=Object.keys(D.forms||{});const l1=keys.filter(k=>k.startsWith('L1|')),l2=keys.filter(k=>k.startsWith('L2|'));
 const sortK=a=>a.sort((x,y)=>D.forms[y].latest-D.forms[x].latest);sortK(l1);sortK(l2);
 let h=`<div class="card"><div class="hint" style="margin-bottom:6px">제형 대분류 (NFC 1)</div><div class="chips">${l1.map(k=>`<span class="chip ${k===q?'on':''}" data-f="${esc(k)}">${esc(k.slice(3).replace(/^[A-Z]_/,''))}</span>`).join('')}</div><div class="hint" style="margin:8px 0 6px">제형 중분류 (NFC 2)</div><div class="chips">${l2.slice(0,40).map(k=>`<span class="chip ${k===q?'on':''}" data-f="${esc(k)}">${esc(k.slice(3).replace(/^[A-Z]{2}_/,''))}</span>`).join('')}</div></div>`;
 const b=q&&D.forms[q];if(b)h+=`<div class="card"><h3>${esc(q.slice(3))}</h3></div>`+block(b);else h+=`<div class="card hint">제형을 고르면 시장 규모·추이·제조사·제뉴원 점유가 표시됩니다. 제뉴원 설비(고형제·연질캡슐·주사제 등)와 맞는 제형에서 점유가 낮은 곳이 수주 여지입니다.</div>`;
 M.innerHTML=h;document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>form(c.dataset.f));}

/* ── 대상회사 ── */
function company(q){const C=D.companies_detail||{};const meta=D.companies?.meta||{};const names=Object.keys(C);
 let h=`<div class="card"><select id="cq"><option value="">회사 선택</option>${names.map(n=>`<option ${n===q?'selected':''} value="${esc(n)}">${esc(n)} — ${esc(meta[C[n].category]?.label||C[n].category)}</option>`).join('')}</select></div>`;
 const c=q&&C[q];if(c){const p=c.profile||{},pk=(D.issues?.peers||[]).find(x=>x.name===q);
  h+=`<div class="kpis">${kpi('IQVIA 분기 매출',eok(p.market?.total),esc(p.market?.latest_q||''))}${kpi('원외처방 12개월',eok(p.ubist?.sales_12m),esc(p.ubist?.period||''))}${kpi('수탁 비중 (생산액)',(p.production?.toll_share??'—')+'%','자사 '+(p.production?.own_share??'—')+'% · 품목 '+fmt(p.production?.items))}${kpi('주가',fmt(pk?.latest?.close),pk?`<span class="${cls(pk.latest.change_rate)}">${pct(pk.latest.change_rate,2)}</span> 시총 ${eok(pk.latest.market_cap)}`:(c.listed?'':'비상장'))}</div>`;
  h+=`<div class="row2"><div class="card"><h3>주요 품목 (IQVIA)</h3>${tbl([{h:'품목',f:r=>esc(r.name)},{h:'영역',f:r=>esc(r.area)},{h:'매출',n:1,f:r=>eok(r.amount)},{h:'비중',n:1,f:r=>r.share+'%'}],p.market?.products||[])}</div>`;
  h+=`<div class="card"><h3>제형 구성 (원외처방)</h3>${bars(p.ubist_forms||[],'form','share')}<h3 style="margin-top:12px">허가 품목 제형</h3>${bars(p.approval_forms?.forms||[],'form','share')}</div></div>`;
  h+=`<div class="row2"><div class="card"><h3>생산 구조 — 누가 만드나</h3><div class="hint">자사 생산 ${eok(p.production?.own_amount)} · 위탁 ${eok(p.production?.toll_amount)} (전수DB 생산액)</div>${tbl([{h:'위탁처',f:r=>esc(r.name)},{h:'금액',n:1,f:r=>eok(r.amount)},{h:'품목',n:1,f:r=>fmt(r.items)}],p.production?.clients||[])}</div>`;
  h+=`<div class="card"><h3>판매 채널</h3>${bars(p.channels?.channels||[],'name','share')}<div class="hint">${esc(p.channels?.period||'')}</div><h3 style="margin-top:12px">수출</h3><div class="hint">${p.exports?.available?`수출 ${eok(p.exports.export)} (${p.exports.export_share}%) · ${esc(p.exports.report)}`:'공시 없음'}</div><h3 style="margin-top:12px">임상 승인 영역</h3>${bars(p.clinical?.areas||[],'name','share')}</div></div>`;
  h+=`<div class="card"><h3>M&A·수주 관점 메모</h3><div class="hint">${esc(c.note||'')} · 분류 ${esc(meta[c.category]?.label||c.category)}${c.listed?' · 상장 '+esc(c.stock_code):''}</div><div class="hint">위탁 비중이 높고 제형이 제뉴원 설비와 겹치면 수주 전환 대상, 자사 생산 비중이 높고 채널이 원내 중심이면 생산기지 인수 검토 대상으로 본다.</div></div>`;}
 else h+=`<div class="card hint">회사를 고르면 IQVIA 매출·주요 품목·제형·생산 구조(자사/위탁)·채널·수출·임상을 한 화면에 보여줍니다.</div>`;
 M.innerHTML=h;document.getElementById('cq').onchange=e=>company(e.target.value);}

/* ── 수주 기회 ── */
function cmo(){const c=D.cmo||{};let h=`<div class="kpis">${kpi('수주 전환 가능 시장',eok(c.opportunity),'제뉴원이 만들 수 있는 타사 품목 생산액')}${kpi('그중 이미 위탁 중',eok(c.opportunity_toll),'수탁사 교체 대상')}${kpi('현재 수탁 고객',fmt(c.our_clients)+'사','')}${kpi('시장 참여 회사',fmt(c.market_companies)+'사',esc(String(c.year||'')))}</div>`;
 h+=`<div class="card"><h3>회사별 전환 가능 금액 (상위)</h3>${tbl([{h:'허가사',f:r=>`<a href="#" data-co="${esc(r.link||r.holder)}">${esc(r.holder)}</a>`},{h:'생산액',n:1,f:r=>eok(r.total)},{h:'전환 가능',n:1,f:r=>eok(r.winnable)},{h:'비율',n:1,f:r=>(r.winnable_ratio??'—')+'%'},{h:'이미 당사',n:1,f:r=>eok(r.already)},{h:'위탁 비율',n:1,f:r=>(r.toll_ratio??'—')+'%'},{h:'핵심 위탁 품목',f:r=>esc((r.top_toll||[]).slice(0,3).map(x=>x.name||x).join(', '))}],(c.known||[]).slice(0,60))}</div>`;
 M.innerHTML=h;document.querySelectorAll('[data-co]').forEach(a=>a.onclick=e=>{e.preventDefault();go('company',a.dataset.co)});}

/* ── 자사 품목·성분 ── */
function products(q){const P=D.products?.items||[],I=D.ingredients?.items||[];q=(q||'').toLowerCase();
 const rows=P.filter(r=>!q||[r.product,r.holder,r.ingredient,r.form].join(' ').toLowerCase().includes(q)).slice(0,120);
 let h=`<div class="card"><input id="pq" placeholder="품목·허가사·성분·제형 검색" value="${esc(q)}"><div class="hint" style="margin-top:6px">${esc(String(D.products?.year||''))}년 매출 상위 ${P.length}품목 · 표시 ${rows.length}</div></div>`;
 h+=`<div class="card"><h3>자사 품목 수익성</h3>${tbl([{h:'품목',f:r=>esc(r.product)},{h:'허가사',f:r=>esc(r.holder)},{h:'구분',f:r=>esc(r.biz_unit)},{h:'제형',f:r=>esc(r.form)},{h:'매출',n:1,f:r=>eok(r.sales)},{h:'공헌',n:1,f:r=>(r.our_margin_pct??'—')+'%'},{h:'경쟁',n:1,f:r=>fmt(r.peer_count)}],rows)}</div>`;
 h+=`<div class="card"><h3>주성분 오버뷰 (상위)</h3>${tbl([{h:'성분',f:r=>`<a href="#" data-m="${esc(r.en||'')}">${esc(r.name)}</a>`},{h:'매출',n:1,f:r=>eok(r.sales)},{h:'비중',n:1,f:r=>(r.share??'—')+'%'},{h:'수탁',n:1,f:r=>(r.cmo_share??'—')+'%'},{h:'공헌',n:1,f:r=>(r.margin_pct??'—')+'%'},{h:'품목',n:1,f:r=>fmt(r.items)}],I.slice(0,40))}</div>`;
 M.innerHTML=h;document.getElementById('pq').oninput=e=>{clearTimeout(window._pt);window._pt=setTimeout(()=>products(e.target.value),250)};
 document.querySelectorAll('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=Object.keys(D.molecules||{}).find(m=>m.toLowerCase().split(',')[0].trim()===String(a.dataset.m).toLowerCase().split(',')[0].trim());if(k)go('molecule',k);});}

/* ── 설비 부하 ── */
function backlog(){const b=D.backlog||{};if(!b.available){M.innerHTML='<div class="card hint">수주잔고 데이터 없음</div>';return;}const t=b.totals||{};
 let h=`<div class="kpis">${kpi('수주잔고 합계',fmt(t.all)+'억','')}${kpi('정상',fmt(t.normal)+'억','')}${kpi('설비',fmt(t.equips)+'대','라인 '+fmt(t.lines))}${kpi('품목',fmt(t.products),'')}</div>`;
 h+=`<div class="card"><h3>설비별 부하</h3>${tbl([{h:'사이트',f:r=>esc(r.site)},{h:'설비',f:r=>esc(r.equip)},{h:'제형',f:r=>esc(r.form)},{h:'잔고',n:1,f:r=>fmt(r.amt)+'억'},{h:'CMO',n:1,f:r=>fmt(r.amt_cmo)+'억'},{h:'월 능력',n:1,f:r=>r.monthly?fmt(r.monthly):'—'},{h:'소진 개월',n:1,f:r=>r.months==null?'—':Number(r.months).toFixed(1)}],(b.equips||[]).slice(0,60))}</div>`;
 M.innerHTML=h;}

/* ── 데이터 현황 ── */
function inventory(){const v=D.inventory||{};const st=s=>s==='fresh'?'<span class="badge">최신</span>':s==='stale'?'<span class="badge w">오래됨</span>':'<span class="badge w">없음</span>';
 let h=`<div class="card"><h3>파일 기반 데이터 — 기준시점과 갱신 요청</h3><div class="hint">기준일 ${esc(v.as_of)} · 오래됨 ${v.stale_count} · 없음 ${v.missing_count} · 요청사항대로 파일을 교체하고 publish.bat 을 실행하면 이 링크에 반영됩니다.</div>${tbl([{h:'항목',f:r=>`<b>${esc(r.name)}</b>`},{h:'파일',f:r=>esc(r.file||'—')},{h:'기준시점',f:r=>esc(r.as_of||'—')},{h:'경과',n:1,f:r=>r.age_days==null?'—':r.age_days+'일'},{h:'판정',f:r=>st(r.status)+' <span class="hint">'+esc(r.verdict)+'</span>'},{h:'쓰이는 곳',f:r=>esc(r.used)},{h:'요청사항',f:r=>esc(r.request||'')}],v.files||[])}</div>`;
 h+=`<div class="card"><h3>실시간 수집 (GitHub Actions 매일 07:30)</h3>${tbl([{h:'소스',f:r=>`<b>${esc(r.name)}</b>`},{h:'주기',f:r=>esc(r.verdict)},{h:'쓰이는 곳',f:r=>esc(r.used)}],v.live||[])}<div class="hint">${LIVE?'마지막 수집 '+esc(LIVE.fetched_at):'실시간 파일(live.enc)이 아직 없습니다 — GitHub Actions가 처음 실행된 뒤 표시됩니다.'}</div></div>`;
 M.innerHTML=h;}

/* ── 실시간(live.enc) — 같은 비밀번호로 복호화 ── */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unseal(pw,pk){const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(pk.salt),iterations:pk.iter,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pk.iv)},key,b64(pk.ct));return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
(async()=>{try{const pw=sessionStorage.getItem('gns_pw');if(!pw||location.protocol==='file:')return;const r=await fetch('live.enc',{cache:'no-store'});if(!r.ok)return;LIVE=JSON.parse(await unseal(pw,await r.json()));if(cur==='home')home();}catch(e){}})();
nav();home();
})();
</script>
